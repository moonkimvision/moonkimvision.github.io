title: MoonKimVision
description: 무표정 쌍둥이 남매가 안내하는 moonkimvision의 모바일 앱과 이야기
url: "https://moonkimvision.com"
baseurl: ""
lang: ko

author:
  name: MOON JOONSEOK
  email: moonkimvision@gmail.com

company:
  name: moonkimvision
  representative: MOON JOONSEOK
  address: "101-507, 14 Dapsimni-ro 38-gil, Dongdaemun-gu, Seoul, 02595, Republic of Korea"
  email: moonkimvision@gmail.com
  registration: "407-64-00770"

# 검색엔진·링크 미리보기 (jekyll-seo-tag)
logo: /assets/images/twins/apple-touch-icon.png
twitter:
  card: summary_large_image
social:
  name: moonkimvision
  links:   # _data/sns.yml 과 같은 주소
    - https://www.youtube.com/@moonkimvision
    - https://www.instagram.com/moonkimvision/
    - https://www.tiktok.com/@moonkimvision

# 방문자 통계 (쿠키 없음, 배포 환경에서만 집계) — 대시보드: https://moonkimvision.goatcounter.com
goatcounter: moonkimvision

# Google AdSense (배포 환경에서만 스크립트 삽입, ads.txt 와 같은 퍼블리셔 ID)
adsense: ca-pub-4229185752173546

# 페이지 기본값
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/twins/og-twins.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: ko
  # 정책 페이지는 링크로만 연다 — 사이트 어디에도 링크하지 않고, 검색·사이트맵에서도 뺀다
  - scope:
      path: "privacy"
    values:
      sitemap: false
      noindex: true
  # 서치 콘솔 소유 확인 파일은 사이트맵에서 뺀다
  - scope:
      path: "google4605d158ba2cf69d.html"
    values:
      sitemap: false
  - scope:
      path: "googlec5c3312ac4743926.html"
    values:
      sitemap: false

# 빌드 설정
markdown: kramdown
highlighter: rouge
permalink: /posts/:slug/

# 제외 경로
exclude:
  - Gemfile
  - Gemfile.lock
  - ralph-core/
  - BACKLOG.md
  - README.md
  - CLAUDE.md
  - "*.py"
  - .claude/

# 플러그인 (GitHub Pages 허용 목록)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
