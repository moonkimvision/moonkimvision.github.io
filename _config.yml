title: MoonKimVision
description: 앱 개인정보처리방침 및 개발 블로그
url: "https://moonkimvision.github.io"
baseurl: ""
lang: ko

author:
  name: Peter Moon
  email: moonkimvision@gmail.com

# 빌드 설정
markdown: kramdown
highlighter: rouge
permalink: /posts/:slug/

# 제외 경로
exclude:
  - Gemfile
  - Gemfile.lock
  - ralph-core/
  - BACKLOG.md
  - README.md
  - "*.py"
  - .claude/

# 플러그인 (GitHub Pages 허용 목록)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
