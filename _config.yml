title: MoonKimVision
description: 무표정 쌍둥이 남매가 안내하는 moonkimvision의 모바일 앱과 이야기
url: "https://moonkimvision.github.io"
baseurl: ""
lang: ko

author:
  name: MOON JOONSEOK
  email: moonkimvision@gmail.com

company:
  name: moonkimvision
  representative: MOON JOONSEOK
  address: "101-507, 14 Dapsimni-ro 38-gil, Dongdaemun-gu, Seoul, 02595, Republic of Korea"
  email: moonkimvision@gmail.com
  registration: "407-64-00770"

# 페이지 기본값
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/twins/og-twins.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: ko

# 빌드 설정
markdown: kramdown
highlighter: rouge
permalink: /posts/:slug/

# 제외 경로
exclude:
  - Gemfile
  - Gemfile.lock
  - ralph-core/
  - BACKLOG.md
  - README.md
  - "*.py"
  - .claude/

# 플러그인 (GitHub Pages 허용 목록)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
