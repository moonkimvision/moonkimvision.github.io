# 공동책임 (아빠 콤비) 캐릭터 프로필 데이터 — _data/characters.yml 의 gongdong 그룹
# 원본 설정: marketing-studio/projects/twins/marketing/character/CHARACTER.md ('공동책임', §11 아빠, §14 노 책임)
