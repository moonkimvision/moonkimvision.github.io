dad:
  id: dad
  url: /gongdong/dad/
  other: coworker
  name_ko: 유 책임
  name_en: Lead Yu
  badge_ko: 쌍둥이 아빠
  badge_en: The twins' dad
  role_ko: 아재개그 · 호탕 담당
  role_en: The Dad-Joker
  oneliner_ko: 무표정 집안에서 혼자 표정이 다 드러나는 사람.
  oneliner_en: The only face in a deadpan family that shows everything.
  intro_ko: >-
    성(유)과 직책(책임)만 있고 이름은 나오지 않는다. 인상 좋고 호탕해서 웬만한 일은
    "하하하!" 한 번에 넘긴다. 아재개그를 쉬지 않고 던지고 혼자 제일 크게 웃는다.
    아이스크림 실종 사건의 진범이지만, 들켜도 당당해서 남매도 결국 화를 못 낸다.
  intro_en: >-
    All we know is his surname (Yu) and his job title (Lead) — his first name never comes up.
    Big-hearted and loud, he laughs off almost anything with one "Hahaha!" He fires dad jokes
    nonstop and laughs at them the hardest. He's the culprit behind the missing ice cream,
    but he owns it so cheerfully that the twins can't stay mad.
  images:
    front: /assets/images/gongdong/dad-front.webp
    three_quarter: /assets/images/gongdong/dad-34.webp
    side: /assets/images/gongdong/dad-side.webp
    face: /assets/images/gongdong/dad-face.webp
  profile:
    - label_ko: 호칭
      label_en: Called
      ko: 남매는 "아빠", 노 책임은 "유 책임님"
      en: "\"Dad\" to the twins, \"Lead Yu\" to Lead No"
    - label_ko: 포지션
      label_en: Role
      ko: 아재개그와 근거 없는 자신감 (튀는 쪽)
      en: Dad jokes and unfounded confidence (the loud one)
    - label_ko: 성격
      label_en: Personality
      ko: 낙천가. 걱정을 오래 못 하고, 진지한 분위기를 못 견뎌 먼저 깬다. 자식 바보
      en: An optimist who can't worry for long and always breaks a serious mood first. Dotes on his kids
    - label_ko: 말투
      label_en: Speech
      ko: 크고 시원한 반말. "허허", "아이고~", "자, 봐 봐" 로 시작해서 "~지!" 로 신나게 맺는다
      en: Loud and casual. Opens with "Heh heh", "Oh boy~", "Look, look" — ends on a high note
    - label_ko: 외형
      label_en: Look
      ko: 짧게 넘긴 흑발, 둥근 얼굴, 깎아도 남는 회색 수염 자국, 따뜻한 눈매
      en: Short slicked-back hair, round face, a gray five-o'clock shadow, warm eyes
    - label_ko: 옷
      label_en: Outfit
      ko: 무지 흰 반팔 티 + 진회색 트레이닝 바지 + 회색 실내 슬리퍼
      en: Plain white tee, dark gray sweatpants, gray house slippers
    - label_ko: 시그니처
      label_en: Signature
      ko: 주황 손목시계 줄 — 쌍둥이 손목 밴드와 같은 색
      en: An orange watch strap — the same color as the twins' wristbands
    - label_ko: 좋아하는 것
      label_en: Loves
      ko: 아재개그, 남매 자랑, 남의 아이스크림
      en: Dad jokes, bragging about his kids, other people's ice cream
    - label_ko: 약한 것
      label_en: Weak spot
      ko: 엄마. 엄마 앞에서는 꼼짝 못 한다
      en: Mom. He's powerless in front of her
  quotes:
    - ko: 노 책임~ 아재개그 하나 할까? 하하!
      en: Hey, Lead No~ Want to hear a dad joke? Ha!
    - ko: 아빠가 먹었지! 맛있더라!
      en: I ate it! It was delicious!
    - ko: 요즘 그거… 갓생? 아빠도 갓생 살아!
      en: What's the word… "grindset"? Dad's on the grindset too!
    - ko: 이건 공동 책임이야, 노 책임!
      en: This is a joint responsibility, Lead No!
    - ko: 역시 노 책임은 보는 눈이 있어!
      en: See? Lead No really knows quality!
  stats:
    - key: dadjoke
      value: 99
    - key: energy
      value: 95
    - key: confidence
      value: 90
    - key: dry
      value: 5
    - key: formal
      value: 0

coworker:
  id: coworker
  url: /gongdong/coworker/
  other: dad
  name_ko: 노 책임
  name_en: Lead No
  badge_ko: 아빠 회사 동기
  badge_en: Dad's coworker
  role_ko: 건조한 한마디 · 정리 담당
  role_en: The Dry One
  oneliner_ko: 늘 피곤한데 일은 제일 잘하는 사람.
  oneliner_en: Always tired, always the best at the job.
  intro_ko: >-
    유 책임과 입사 동기, 같은 직급. 퇴근길마다 유 책임에게 붙잡혀 이 집 거실까지 끌려온다.
    그래서 집에서도 사원증을 목에 걸고 있다. 아직 퇴근을 못 했다는 뜻이다.
    상황을 사실 한 줄로 정리하면 장면이 끝난다. 말은 차가운데 손은 따뜻해서,
    아빠가 깜빡한 심부름을 이미 사 와 있곤 한다. 들키면 "…남은 거예요."
  intro_en: >-
    Lead Yu's coworker from the same hiring class, same title. Every evening Lead Yu drags him home
    "for just one drink," so he's always in the living room — still wearing his ID badge,
    because technically he never clocked out. One flat, factual sentence from him ends any scene.
    Cold words, warm hands: he's usually already bought the groceries Dad forgot.
    If you catch him, it's "…They were leftovers."
  images:
    front: /assets/images/gongdong/coworker-front.webp
    three_quarter: /assets/images/gongdong/coworker-34.webp
    side: /assets/images/gongdong/coworker-side.webp
    face: /assets/images/gongdong/coworker-face.webp
  profile:
    - label_ko: 호칭
      label_en: Called
      ko: 노 책임. 아빠를 꼬박꼬박 "유 책임님"이라고 부르고, 남매에게도 존댓말
      en: Lead No — always calls Dad "Lead Yu," and speaks politely even to the kids
    - label_ko: 포지션
      label_en: Role
      ko: 들뜬 유 책임 옆에서 장면을 닫는 마지막 한 줄
      en: The last line that closes the scene next to an overexcited Lead Yu
    - label_ko: 성격
      label_en: Personality
      ko: 스마트한 정리꾼. 만성 피로. 시크한데 따뜻하다 — 말 말고 행동으로만
      en: A sharp organizer, chronically tired. Cool on the outside, warm in what he does — never in what he says
    - label_ko: 말투
      label_en: Speech
      ko: 짧은 존댓말, 끝은 늘 내림. 대답 앞에 반 박자 정적. 사내 말투가 섞인다
      en: Short and polite, always trailing down, with a half-beat pause first. Office-speak slips in
    - label_ko: 외형
      label_en: Look
      ko: 마르고 길쭉한 50대, 짧게 넘긴 은회색 머리, 얇은 사각 안경, 반쯤 감긴 피곤한 눈
      en: Tall and thin, in his fifties — short swept-back silver hair, thin square glasses, tired half-closed eyes
    - label_ko: 옷
      label_en: Outfit
      ko: 흰 셔츠 + 진회색 니트 조끼 + 검정 바지 + 검정 구두
      en: White shirt, dark gray knit vest, black trousers, black shoes
    - label_ko: 시그니처
      label_en: Signature
      ko: 주황 사원증 목걸이 줄 — 집에서도 안 뺀다
      en: An orange ID-badge lanyard — he never takes it off, even at their house
    - label_ko: 좋아하는 것
      label_en: Loves
      ko: (말 안 함) 퇴근, 커피, 사실 유 책임님
      en: (Won't say.) Clocking out, coffee — and Lead Yu, actually
    - label_ko: 특기
      label_en: Talent
      ko: 소란 속에서 눈 감고 있다가 끝나자마자 한 줄로 정리하기, 남매와 같은 눈으로 아빠 쳐다보기
      en: Dozing through the chaos, then summing it up in one line — and giving Dad the same look the twins do
  quotes:
    - ko: 아, 네.
      en: Ah. Okay.
    - ko: …안 웃겨요.
      en: …Not funny.
    - ko: 그건 유 책임님 생각이고요.
      en: That's your opinion, Lead Yu.
    - ko: 유 책임님, 그거 회의 때도 하셨어요.
      en: Lead Yu, you did that one in the meeting too.
    - ko: …저는 퇴근했는데요.
      en: …I clocked out, though.
    - ko: …남은 거예요.
      en: …They were leftovers.
  stats:
    - key: dadjoke
      value: 0
    - key: energy
      value: 10
    - key: confidence
      value: 30
    - key: dry
      value: 98
    - key: formal
      value: 100

