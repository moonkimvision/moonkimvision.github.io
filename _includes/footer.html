<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <p class="footer-brand">{{ site.company.name }}</p>
        <p>대표자: {{ site.company.representative }}</p>
        <p>사업자등록번호: {{ site.company.registration }}</p>
      </div>
      <div class="footer-col">
        <p>{{ site.company.address }}</p>
        <p><a href="mailto:{{ site.company.email }}">{{ site.company.email }}</a></p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.company.name }}. All rights reserved.</p>
    </div>
  </div>
</footer>
