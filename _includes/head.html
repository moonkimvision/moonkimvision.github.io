<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF6E5">
  <script>
  // 언어 선택을 첫 페인트 전에 적용해 깜빡임을 막는다. (setLang 은 footer 스크립트)
  (function () {
    // 한 언어로만 쓴 페이지(블로그 포스트 등)는 그 언어로 고정
    if (document.documentElement.hasAttribute('data-lang-fixed')) return;
    var l = null;
    try { l = localStorage.getItem('site-lang'); } catch (e) {}
    if (l !== 'ko' && l !== 'en') {
      l = (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
    }
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l);
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/images/twins/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/twins/apple-touch-icon.png' | relative_url }}">
  {%- if site.goatcounter and jekyll.environment == "production" %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {%- endif %}
  {%- if site.adsense and jekyll.environment == "production" %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense }}" crossorigin="anonymous"></script>
  {%- endif %}
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  {% seo %}
  {% feed_meta %}
</head>
