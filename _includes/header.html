{%- assign path = page.url -%}
{%- assign bilingual = false -%}
{%- if page.bilingual or layout.bilingual -%}{%- assign bilingual = true -%}{%- endif -%}
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-faces" aria-hidden="true">
        <img src="{{ '/assets/images/twins/sister-face.png' | relative_url }}" alt="" width="34" height="34">
        <img src="{{ '/assets/images/twins/brother-face.png' | relative_url }}" alt="" width="34" height="34">
      </span>
      <span class="brand-name">{{ site.title | downcase }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if path == '/' %} aria-current="page"{% endif %}><span class="lang-ko">홈</span><span class="lang-en">Home</span></a>
      <a href="{{ '/twins/' | relative_url }}"{% if path contains '/twins/' %} aria-current="page"{% endif %}><span class="lang-ko">쌍둥이</span><span class="lang-en">Twins</span></a>
      <a href="{{ '/apps/' | relative_url }}"{% if path contains '/apps/' %} aria-current="page"{% endif %}><span class="lang-ko">앱</span><span class="lang-en">Apps</span></a>
      <a href="{{ '/posts/' | relative_url }}"{% if path contains '/posts/' %} aria-current="page"{% endif %}><span class="lang-ko">블로그</span><span class="lang-en">Blog</span></a>
      <a href="{{ '/privacy/' | relative_url }}"{% if path contains '/privacy/' %} aria-current="page"{% endif %}><span class="lang-ko">정책</span><span class="lang-en">Policies</span></a>
    </nav>
    {%- if bilingual %}
    <div class="lang-switcher" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-set-lang="ko">한국어</button>
      <button type="button" class="lang-btn" data-set-lang="en">EN</button>
    </div>
    {%- endif %}
  </div>
</header>
