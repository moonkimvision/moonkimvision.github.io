---
layout: default
---
<div class="home-lang-bar">
  <div class="container home-lang-bar-inner">
    <div class="lang-switcher" role="group" aria-label="Language selector">
      <button class="lang-btn" id="btn-ko" onclick="setLang('ko')" aria-pressed="true">한국어</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')" aria-pressed="false">English</button>
    </div>
  </div>
</div>

{{ content }}

<style>
.home-lang-bar {
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
  padding: 0.45rem 0;
}
.home-lang-bar-inner {
  display: flex;
  justify-content: flex-end;
}
.home-lang-bar .lang-switcher {
  display: flex;
  gap: 0;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  overflow: hidden;
}
.home-lang-bar .lang-btn {
  padding: 0.3rem 0.85rem;
  border: none;
  background: #f9fafb;
  color: #374151;
  font-size: 0.82rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  font-family: inherit;
}
.home-lang-bar .lang-btn:first-child { border-right: 1px solid #d1d5db; }
.home-lang-bar .lang-btn.active {
  background: #111827;
  color: #fff;
  font-weight: 600;
}
.home-lang-bar .lang-btn:hover:not(.active) { background: #e5e7eb; }
</style>

<script>
(function () {
  var stored = localStorage.getItem('site-lang');
  var initial = stored || (navigator.language && navigator.language.startsWith('ko') ? 'ko' : 'en');
  setLang(initial);

  function setLang(lang) {
    var isKo = lang === 'ko';
    document.querySelectorAll('.lang-ko').forEach(function(el){ el.style.display = isKo ? '' : 'none'; });
    document.querySelectorAll('.lang-en').forEach(function(el){ el.style.display = isKo ? 'none' : ''; });
    var btnKo = document.getElementById('btn-ko');
    var btnEn = document.getElementById('btn-en');
    btnKo.classList.toggle('active', isKo);
    btnEn.classList.toggle('active', !isKo);
    btnKo.setAttribute('aria-pressed', String(isKo));
    btnEn.setAttribute('aria-pressed', String(!isKo));
    localStorage.setItem('site-lang', lang);
  }

  window.setLang = setLang;
})();
</script>
