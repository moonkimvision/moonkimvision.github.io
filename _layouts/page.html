---
layout: default
---
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {%- if page.date -%}
      <p class="page-meta">최종 업데이트: {{ page.date | date: "%Y년 %m월 %d일" }}</p>
    {%- endif -%}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
