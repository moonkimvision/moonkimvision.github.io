---
layout: default
bilingual: true
---
<div class="page-wrapper">
  <article class="page paper">
    <header class="page-header">
      <p class="eyebrow"><span class="lang-ko">개인정보처리방침</span><span class="lang-en">Privacy Policy</span></p>
      <h1 class="lang-ko-el">{{ page.title_ko }}</h1>
      <h1 class="lang-en-el">{{ page.title_en }}</h1>
      {%- if page.date -%}
        <p class="page-meta lang-ko-el">시행일: {{ page.date | date: "%Y년 %m월 %d일" }}</p>
        <p class="page-meta lang-en-el">Effective Date: {{ page.date | date: "%B %-d, %Y" }}</p>
      {%- endif -%}
    </header>
    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>
