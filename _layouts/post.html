---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y년 %m월 %d일" }}
      {%- if page.tags.size > 0 -%}
        &nbsp;·&nbsp;
        {%- for tag in page.tags -%}
          <span class="tag">{{ tag }}</span>
        {%- endfor -%}
      {%- endif -%}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
